<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Mahyar Gap — Talk, share and stay close</title>
  <meta name="description" content="Mahyar Gap is a modern communication platform with real-time channels, direct messages, LiveKit voice, video, screen sharing, roles and presence." />
  <meta name="theme-color" content="#0b0b12" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

  <!-- Google Fonts: Inter & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <!-- Font Awesome 6 Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.5.2/css/all.min.css" />

  <!-- Production Tailwind CSS built locally with the project build. -->
  <link rel="stylesheet" href="css/tailwind.generated.css" />

  <!-- Mahyar Gap design system -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="bg-chat text-primary-token select-none">

  <!-- Full-Viewport 4-Column Communication Workspace -->
  <div class="flex h-screen w-screen overflow-hidden relative app-shell">

    <!-- Left Navigation Wrapper (Server Rail + Channel/DM Sidebar) -->
    <aside id="left-navigation-wrapper" class="hidden md:flex h-full shrink-0 z-30 navigation-drawer-mobile">
      <!-- Mobile drawer header -->
      <div class="mobile-drawer-head">
        <span class="mg-wordmark">Mahyar <strong>Gap</strong></span>
        <button data-action="toggleMobileDrawer" class="p-2 rounded-lg text-secondary-token hover:text-primary-token" title="Close navigation" aria-label="Close navigation">
          <i class="fa-solid fa-xmark"></i>
        </button>
      </div>

      <!-- Column 1: Server Icon Rail (72px) -->
      <nav aria-label="Servers Navigation" class="w-[72px] bg-server-rail py-3 flex flex-col items-center justify-between border-r border-subtle overflow-y-auto shrink-0">
        <div class="flex flex-col items-center w-full">
          <div class="mg-rail-logo" title="Mahyar Gap" aria-label="Mahyar Gap">
            <span>MG</span>
          </div>
          <div class="rail-divider"></div>
          <div id="server-rail-list" class="flex flex-col items-center w-full"></div>
        </div>
        <div class="flex flex-col items-center gap-2 pt-2">
          <button data-action="openModal" data-action-args="[&quot;userSettings&quot;]" class="rail-utility-btn" title="User Settings" aria-label="User Settings">
            <i class="fa-solid fa-gear text-sm"></i>
          </button>
        </div>
      </nav>

      <!-- Column 2: Channel & DM Navigation Sidebar (248px) -->
      <section aria-label="Channels and Direct Messages" class="w-60 bg-sidebar flex flex-col h-full border-r border-subtle shrink-0">
        <!-- Server Name / DM Search Header -->
        <header id="sidebar-header" class="h-12 px-4 border-b border-subtle flex items-center justify-between shrink-0"></header>

        <!-- Scrollable Channel Tree / DM Conversation List -->
        <div id="sidebar-body" class="flex-1 overflow-y-auto py-2"></div>

        <!-- Active live media connection telemetry bar -->
        <div id="voice-connection-status-bar" class="hidden shrink-0"></div>

        <!-- Current User Profile & Quick Audio Controls -->
        <footer id="user-control-panel" class="shrink-0"></footer>
      </section>
    </aside>

    <!-- Mobile navigation backdrop -->
    <div id="mobile-drawer-backdrop" class="mobile-drawer-backdrop" data-action="toggleMobileDrawer" aria-hidden="true"></div>

    <!-- Column 3: Main Stage -->
    <main class="flex-1 flex flex-col h-full bg-chat overflow-hidden min-w-0">
      <!-- Top Channel / DM Header Bar -->
      <header id="main-top-header" class="h-12 px-4 border-b border-subtle flex items-center justify-between gap-2 shrink-0 bg-chat z-10"></header>

      <!-- Central Stage & Right Member Sidebar Wrapper -->
      <div class="flex-1 flex overflow-hidden relative">
        <!-- Main Stage Container -->
        <section id="main-stage-container" class="flex-1 flex flex-col h-full overflow-hidden min-w-0 select-text"></section>

        <!-- Column 4: Right Member List / Active Voice Status Sidebar -->
        <aside id="right-member-sidebar" aria-label="Server Members" class="w-60 bg-sidebar border-l border-subtle overflow-y-auto shrink-0 member-sidebar-desktop hidden"></aside>
      </div>
    </main>

  </div>

  <!-- Dynamic Modal Container -->
  <div id="modal-root"></div>

  <!-- Participant context menu (right-click / long-press) -->
  <div id="context-menu-root"></div>

  <!-- Toast Notification Stack -->
  <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

  <!-- Application Scripts -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="js/api.js"></script>
  <script src="/vendor/livekit-client.js"></script>
  <script src="js/webrtc.js"></script>
  <script src="js/music.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
